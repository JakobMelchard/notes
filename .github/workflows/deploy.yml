name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .site
    steps:
      - name: Fetch canonical public site source
        working-directory: ${{ github.workspace }}
        run: git clone --branch main --single-branch https://codeberg.org/lilfeelz/notes.git .site
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .site/.node-version
          cache: npm
          cache-dependency-path: .site/package-lock.json
      - run: npm ci
      - run: scripts/notes.sh
      # Exported prose is gitignored here, so validate the imported content before publishing.
      - run: python3 scripts/check.py
      - run: npx quartz build
      - run: npm run drill
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
