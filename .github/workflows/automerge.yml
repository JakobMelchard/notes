name: automerge

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]

permissions: {}

jobs:
  automerge:
    uses: JakobMelchard/.github/.github/workflows/automerge.yml@baeda3e262210ce1619b843985fe9ceb84f92199 # v2.8.2
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      id-token: write
