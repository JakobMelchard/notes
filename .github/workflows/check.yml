name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    uses: JakobMelchard/.github/.github/workflows/node.yml@baeda3e262210ce1619b843985fe9ceb84f92199 # v2.8.2
    with:
      node-version: "22.23.4"
      check-cmd: scripts/notes.sh && npx quartz build && npm run drill && python3 scripts/check.py
      lint-cmd: ""
      test-cmd: npm test

  py:
    uses: JakobMelchard/.github/.github/workflows/python.yml@baeda3e262210ce1619b843985fe9ceb84f92199 # v2.8.2
    with:
      # System python: numpy temporary elision (asserted by test_profiling) does not fire on the setup-python build.
      install-cmd: uv sync --all-extras --python /usr/bin/python3
      lint-cmd: ruff check && uv run ruff format --check && uv run mypy && shellcheck --severity=warning scripts/*.sh scripts/ci/*.sh
      test-cmd: >-
        pytest scripts -q -p no:cacheprovider
        && scripts/notes.sh
        && scripts/ci/course-pytest.sh
        && scripts/ci/course-shell-tests.sh
        && scripts/ci/llvm.sh
        && export PATH="$HOME/bin:$PATH"
        && STDLIB=-stdlib=libc++ scripts/ci/course-make.sh

  # Stable names for the required status checks `check` and `tests` in the main ruleset.
  check:
    if: ${{ always() }}
    needs: site
    runs-on: ubuntu-latest
    steps:
      - env:
          R: ${{ needs.site.result }}
        run: test "$R" = success

  tests:
    if: ${{ always() }}
    needs: py
    runs-on: ubuntu-latest
    steps:
      - env:
          R: ${{ needs.py.result }}
        run: test "$R" = success
