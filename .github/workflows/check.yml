name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: scripts/notes.sh
      - run: npx quartz build
      - run: npm run drill
      - run: python3 scripts/check.py
      - run: npm test

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: shellcheck --severity=warning scripts/*.sh scripts/ci/*.sh
      - run: uv run pytest scripts -q -p no:cacheprovider
      - run: scripts/notes.sh
      - name: pytest per course
        run: scripts/ci/course-pytest.sh
      - name: shell tests per course
        run: scripts/ci/course-shell-tests.sh
      - name: LLVM 21, OpenMP and MPI
        run: scripts/ci/llvm.sh
      - name: make test per course
        timeout-minutes: 45
        env:
          STDLIB: -stdlib=libc++
        run: scripts/ci/course-make.sh
